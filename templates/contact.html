{% extends "base.html" %} 

{% block css_files %}
    <link rel="stylesheet" href="{{static('css/contact.css')}}" />
{% endblock css_files %} 

{% block title %}Jewellery Brand Elira FastAPI{% endblock title %} 

{% block content %}
    <section class="contact">
        <div class="container">
            <div class="header-content"></div>
            <div class="contact-block">
                <h2 class="contact-title">Contact Us</h2>
                <p class="contact-text">Say Hello send us your thoughts about our products or share your ideas with our Team!</p>
                <form class="contact-form" method="POST" action="/contact">
                    <div class="contact-box">
                        <input class="contact-input" type="text" name="first_name" placeholder="First name" required>
                        <input class="contact-input" type="text" name="last_name" placeholder="Last name" required>
                        <input class="contact-input" type="tel" name="number" placeholder="Phone" required>
                        <input class="contact-input" type="email" name="email" placeholder="Email" required>
                    </div>
                    <textarea class="contact_text" name="text" placeholder="Message" required></textarea>
                    <button class="contact-btn" type="submit">SEND</button>
                </form>
            </div>
        </div>
    </section>
{% endblock content %}
